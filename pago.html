<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu pago · MANASTINA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#F9F1EA;color:#331821;font-family:Jost,system-ui,sans-serif;
       padding:40px 22px calc(40px + env(safe-area-inset-bottom));text-align:center}
  .caja{width:100%;max-width:480px;animation:subir .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes subir{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .logo{height:34px;margin-bottom:38px;opacity:.9}
  .icono{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         margin:0 auto 22px;font-size:30px;line-height:1}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(28px,6vw,38px);font-weight:700;
     line-height:1.15;margin-bottom:14px}
  p{font-size:14.5px;line-height:1.75;color:#6E4B58;margin-bottom:10px}
  .datos{margin:26px 0 30px;border:1px solid rgba(51,24,33,.14);border-radius:2px;padding:18px 20px;text-align:left}
  .fila{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:7px 0}
  .fila span:first-child{color:#8A6472;letter-spacing:.04em}
  .fila span:last-child{font-weight:500;text-align:right}
  .acciones{display:flex;flex-direction:column;gap:11px}
  a.boton{display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;
          border-radius:2px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
          text-decoration:none;transition:background .35s ease,color .35s ease}
  a.lleno{background:#4C0F2E;color:#F9F1EA}
  a.lleno:hover{background:#331821}
  a.linea{border:1px solid rgba(51,24,33,.3);color:#4C0F2E}
  a.linea:hover{background:#4C0F2E;color:#F9F1EA}
  .cargando{display:inline-block;width:26px;height:26px;border:2px solid rgba(76,15,46,.2);
            border-top-color:#4C0F2E;border-radius:50%;animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .nota{margin-top:24px;font-size:11.5px;color:#8A6472}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="caja">
    <img class="logo" src="assets/manastina-logo-completo.png" alt="MANASTINA"
         onerror="this.style.display='none'">
    <div id="contenido">
      <div class="icono" style="background:rgba(76,15,46,.08)"><span class="cargando"></span></div>
      <h1>Confirmando tu pago</h1>
      <p>Un segundo, estamos verificando con PagoPar.</p>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // Se completan al desplegar, igual que en la tienda.
  var SUPABASE_URL = "https://api.neura.com.py";
  var SUPABASE_ANON = "";
  var WA = "595972897875";

  var contenido = document.getElementById("contenido");
  var hash = new URLSearchParams(location.search).get("hash") || "";

  function gs(n) {
    return "Gs. " + Number(n || 0).toLocaleString("es-PY").replace(/,/g, ".");
  }

  function pintar(estado, datos) {
    var d = datos || {};
    var saludo = d.nombre ? d.nombre + ", " : "";

    var vistas = {
      pagado: {
        color: "#1E6B4F", fondo: "rgba(30,107,79,.1)", icono: "&check;",
        titulo: "¡Gracias por tu compra!",
        texto: saludo
          ? saludo.charAt(0).toUpperCase() + saludo.slice(1) + "recibimos tu pago. Te escribimos por WhatsApp para coordinar la entrega."
          : "Recibimos tu pago. Te escribimos por WhatsApp para coordinar la entrega."
      },
      rechazado: {
        color: "#9F507D", fondo: "rgba(159,80,125,.1)", icono: "&times;",
        titulo: "El pago no se completó",
        texto: "No se hizo ningún cobro. Podés intentar de nuevo o escribirnos y lo resolvemos juntas."
      },
      pendiente: {
        color: "#B07B2E", fondo: "rgba(176,123,46,.12)", icono: "&hellip;",
        titulo: "Tu pago está en proceso",
        texto: "Algunos medios de pago tardan unos minutos en acreditarse. Apenas se confirme te avisamos por WhatsApp."
      }
    };

    var v = vistas[estado] || vistas.pendiente;

    var html =
      '<div class="icono" style="background:' + v.fondo + ';color:' + v.color + '">' + v.icono + "</div>" +
      "<h1>" + v.titulo + "</h1>" +
      "<p>" + v.texto + "</p>";

    if (d.numero) {
      html += '<div class="datos">' +
        '<div class="fila"><span>Pedido</span><span>#' + d.numero + "</span></div>" +
        (d.total ? '<div class="fila"><span>Total pagado</span><span>' + gs(d.total) + "</span></div>" : "") +
        (d.modalidad
          ? '<div class="fila"><span>Entrega</span><span>' +
            (d.modalidad === "retiro" ? "Retiro en el local" : "Envío a domicilio") + "</span></div>"
          : "") +
        "</div>";
    }

    var msg = "Hola, Manastina. Consulto por mi pedido" + (d.numero ? " #" + d.numero : "") + ".";
    html += '<div class="acciones">' +
      (estado === "rechazado"
        ? '<a class="boton lleno" href="index.html">Volver a intentar</a>'
        : '<a class="boton lleno" href="index.html">Seguir comprando</a>') +
      '<a class="boton linea" href="https://wa.me/' + WA + "?text=" + encodeURIComponent(msg) +
      '" target="_blank" rel="noopener">Escribirnos por WhatsApp</a>' +
      "</div>";

    if (estado === "pagado" && d.modalidad !== "retiro") {
      html += '<p class="nota">El costo del envío se abona al recibir el pedido.</p>';
    }

    contenido.innerHTML = html;

    // El pedido se pagó: recién ahora se vacía el carrito.
    if (estado === "pagado") {
      try { localStorage.removeItem("manastina_carrito"); } catch (e) {}
    }
  }

  function error(texto) {
    contenido.innerHTML =
      '<div class="icono" style="background:rgba(159,80,125,.1);color:#9F507D">!</div>' +
      "<h1>No pudimos verificar tu pago</h1>" +
      "<p>" + texto + "</p>" +
      '<div class="acciones">' +
      '<a class="boton lleno" href="https://wa.me/' + WA +
      '" target="_blank" rel="noopener">Escribirnos por WhatsApp</a>' +
      '<a class="boton linea" href="index.html">Volver a la tienda</a></div>';
  }

  if (!hash) {
    error("Nos falta el identificador del pedido. Escribinos y lo buscamos por vos.");
    return;
  }
  if (!SUPABASE_ANON) {
    error("El cobro online todavía no está habilitado.");
    return;
  }

  // Algunos medios acreditan con demora: si sigue pendiente, se reintenta.
  var intentos = 0;

  function consultar() {
    fetch(SUPABASE_URL + "/functions/v1/estado-pago?hash=" + encodeURIComponent(hash), {
      headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON }
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error ? res.d.error : "No encontramos el pedido.");
        if (res.d.estado === "pendiente" && intentos < 3) {
          intentos++;
          setTimeout(consultar, 3000);
          return;
        }
        pintar(res.d.estado, res.d);
      })
      .catch(function (e) {
        error(e && e.message ? e.message : "Probá de nuevo en un momento.");
      });
  }

  consultar();
})();
</script>
</body>
</html>
